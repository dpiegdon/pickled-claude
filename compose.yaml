# pickled-claude: Claude Code in tmux, inside Docker. Copy .env.example to .env (or run ./setup.sh) first.
name: pickled-claude

services:
  claude:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: pickled-claude:local
    container_name: pickled-claude
    hostname: pickle
    init: true
    restart: unless-stopped
    ports:
      # host port 22 belongs to the host's own sshd, hence 2222 by default
      - "${BIND_ADDR:-0.0.0.0}:${SSH_PORT:-2222}:22"
      - "${BIND_ADDR:-0.0.0.0}:${INJECT_PORT:-8080}:8080"
    # Hand the access/error log to the host's journald, which owns rotation
    # and retention:  journalctl -t ledger -f   (docker compose logs works
    # too). No journald on the host (Docker Desktop)? Use `driver: local` —
    # it rotates by default; `json-file` does not.
    logging:
      driver: journald
      options:
        tag: pickled-claude
    environment:
      INJECT_TOKEN: ${INJECT_TOKEN:-}
      INJECT_ENTER_DELAY: ${INJECT_ENTER_DELAY:-0.5}
      CLAUDE_SKIP_PERMISSIONS: ${CLAUDE_SKIP_PERMISSIONS:-1}
      CLAUDE_CONTINUE: ${CLAUDE_CONTINUE:-}
      CLAUDE_ARGS: ${CLAUDE_ARGS:-}
      CLAUDE_CODE_DISABLE_MOUSE: ${CLAUDE_CODE_DISABLE_MOUSE:-0}
      CLAUDE_CODE_NO_FLICKER: ${CLAUDE_CODE_NO_FLICKER:-1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      DISABLE_AUTOUPDATER: ${DISABLE_AUTOUPDATER:-}
      AUTHORIZED_KEYS: ${AUTHORIZED_KEYS:-}
      TZ: ${TZ:-UTC}
    configs:
      - source: authorized_keys
        target: /config/authorized_keys
    volumes:
      - claude-history:/commandhistory
      - claude-config:/home/claude/.claude
      - claude-sessions:/home/claude/.claude/projects
      - claude-ssh-hostkeys:/etc/ssh/hostkeys
      - claude-workspace:/workspace

configs:
  authorized_keys:
    file: ./authorized_keys

volumes:
  claude-history:
      # bash history
      driver: local
      driver_opts:
        type: none
        o: bind
        device: ./.volume_commandhistory
  claude-config:
      # login, settings, .claude.json
      driver: local
      driver_opts:
        type: none
        o: bind
        device: ./.volume_config
  claude-sessions:
      # Mounted inside claude-config: the conversations, so they can be dropped on their own
      # ("docker volume rm pickled-claude_claude-sessions") without touching the login.
      driver: local
      driver_opts:
        type: none
        o: bind
        device: ./.volume_sessions
  claude-ssh-hostkeys:
      # stable SSH host key across recreates
      driver: local
      driver_opts:
        type: none
        o: bind
        device: ./.volume_ssh_hostkeys
  claude-workspace:
      # the projects Claude works on
      driver: local
      driver_opts:
        type: none
        o: bind
        device: ./workspace
