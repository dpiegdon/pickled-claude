# pickled-claude: Claude Code in tmux, inside Docker.
#
# Every relative path below belongs to the instance directory (compose's project directory),
# so several instances can run side by side, each from its own directory with its own .env.
# Create one with "./pickled-claude DIR init" and drive it with "./pickled-claude DIR up|info|...".
# The repository directory is an instance too: plain "docker compose up -d" here still works.
#
# The project name comes from COMPOSE_PROJECT_NAME in the instance's .env (falls back to the
# directory name). It names the container, <project>-claude-1, and both images, which belong
# to this instance alone:
#   <project>-base     the repository's Dockerfile, built with this instance's UID/GID
#   <project>-claude   ./image/Dockerfile on top of it (FROM ${BASE}), what the container runs
# The base has to exist before the overlay builds: "pickled-claude DIR up" (or "build") builds
# them one after the other. A plain "docker compose build" may build both at once and fail.

services:
  # Only an image: the claude service builds on it. It never runs a container.
  base:
    image: ${COMPOSE_PROJECT_NAME:-pickled-claude}-base
    build:
      # The wrapper points this at the repository when the instance lives elsewhere.
      context: ${PICKLED_CLAUDE_SRC:-.}
      # The build uses the host's network stack (DNS, proxies) instead of a bridge.
      network: host
      args:
        UID: ${UID:-30000}
        GID: ${GID:-30000}
    scale: 0

  claude:
    build:
      # The instance's own additions; COPY takes files from ./image.
      context: ./image
      network: host
      args:
        BASE: ${COMPOSE_PROJECT_NAME:-pickled-claude}-base
    image: ${COMPOSE_PROJECT_NAME:-pickled-claude}-claude
    hostname: ${CONTAINER_HOSTNAME:-pickle}
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${SSH_PORT:-30000}:22"
      - "${BIND_ADDR:-127.0.0.1}:${INJECT_PORT:-31000}:8080"
    # Hand the container's output to the host's journald, which owns rotation and retention:
    #   journalctl -t <project>-claude-1 -f      (docker compose logs works too)
    # No journald on the host (Docker Desktop)? Use `driver: local`, it rotates by default;
    # `json-file` does not.
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    environment:
      INJECT_TOKEN: ${INJECT_TOKEN:-}
      INJECT_ENTER_DELAY: ${INJECT_ENTER_DELAY:-0.5}
      CLAUDE_SKIP_PERMISSIONS: ${CLAUDE_SKIP_PERMISSIONS:-1}
      CLAUDE_CONTINUE: ${CLAUDE_CONTINUE:-}
      CLAUDE_ARGS: ${CLAUDE_ARGS:-}
      CLAUDE_CODE_DISABLE_MOUSE: ${CLAUDE_CODE_DISABLE_MOUSE:-0}
      CLAUDE_CODE_NO_FLICKER: ${CLAUDE_CODE_NO_FLICKER:-1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      DISABLE_AUTOUPDATER: ${DISABLE_AUTOUPDATER:-}
      AUTHORIZED_KEYS: ${AUTHORIZED_KEYS:-}
      TZ: ${TZ:-UTC}
    configs:
      - source: authorized_keys
        target: /config/authorized_keys
    # Plain bind mounts: compose resolves them against the instance directory and creates
    # missing directories. Wiping one of them (container stopped) is "rm -rf DIR".
    volumes:
      - ./.volume_commandhistory:/commandhistory           # bash history
      - ./.volume_config:/home/claude/.claude              # login, settings, .claude.json
      # Mounted inside the one above: the conversations, so they can be dropped on their own
      # without touching the login.
      - ./.volume_sessions:/home/claude/.claude/projects
      - ./.volume_ssh_hostkeys:/etc/ssh/hostkeys           # stable SSH host key across recreates
      - ./workspace:/workspace                             # the projects Claude works on

configs:
  authorized_keys:
    file: ./authorized_keys
