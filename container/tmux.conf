# System-wide tmux settings for the Claude Code session (/etc/tmux.conf).
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm*:Tc,tmux*:Tc"
set -g escape-time 0                  # Esc must reach Claude Code immediately
set -g repeat-time 0
set -s extended-keys on               # lets Shift+Enter etc. pass through (terminal permitting)
set -as terminal-features ",xterm*:extkeys"
set -g history-limit 500000
set -g base-index 1
set -g focus-events on
#set -g set-clipboard on
#set -g mouse off                      # "tmux set -g mouse on" if you prefer mouse scrolling
#set -g pane-base-index 0
#set -g renumber-windows on
set -g status-interval 5
set -g status-left "#[bg=blue,fg=white]^B#[bg=red,fg=black] #h::#S"
set -g status-left-length 30
set -g status-justify centre
set -g status-right "#[bg=green]#(date '+KW%V %a %F %R')"
set -g status-bg white
set -g status-fg black

set -g set-titles on
set -g set-titles-string "#T"
set -g mode-keys vi
set -g xterm-keys on
unbind ^b
set -g prefix ^b
bind a send-prefix
bind ^b last-window
unbind Tab
bind Tab last-pane

unbind K
unbind ^K
unbind ^'\'
bind ^'\' confirm-before "kill-server"
unbind '|'
bind '|' confirm-before "kill-session"
unbind '\'
bind '\' confirm-before "kill-pane"

# create new session
unbind C
bind C command-prompt -p "name new session:" "new-session -s '%%'"

# create shared session (duplicates can safely be terminated with kill-session)
unbind ^C
bind ^C command-prompt -p "target-session:" "new-session -t '%%'"

# detach
unbind ^D
bind ^D detach

# window forward/backward
unbind ^n
bind ^n next-window
unbind ^p
bind ^p previous-window

# vi-style cursor keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# rotate through layouts
bind ^Space next-layout

# resize panes like vim (5 at a time)
# (to resize 1 use ^cursor)
bind <  resize-pane -L 5
bind >  resize-pane -R 5
bind -  resize-pane -D 5
bind +  resize-pane -U 5
bind =  resize-pane -U 5

unbind x
bind x select-pane -m
unbind X
bind X select-pane -M
unbind ^x
bind ^x swap-pane

# joining panes
bind J command-prompt -p "join pane -v to:" "join-pane -v -t '%%'"
bind ^J command-prompt -p "join pane -h to:" "join-pane -h -t '%%'"

# copy and save pane backlog
bind Y command-prompt -p "save history to file:" -I "~/tmux.history" "capture-pane -S -32768 ; save-buffer %1 ; delete-buffer"

# ===== command key bindings =====

# split window and re-use current directory
unbind '"'
bind '"' split-window    -c '#{pane_current_path}'

unbind %
bind % split-window -h -c '#{pane_current_path}'

# create new window and re-use current directory
unbind c
bind c new-window -c '#{pane_current_path}'

unbind R
unbind r
unbind T
unbind t
unbind m
unbind P
