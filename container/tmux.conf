# System-wide tmux settings for the Claude Code session (/etc/tmux.conf).
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm*:Tc,tmux*:Tc"
set -s escape-time 10                 # Esc must reach Claude Code immediately
set -s extended-keys on               # lets Shift+Enter etc. pass through (terminal permitting)
set -as terminal-features ",xterm*:extkeys"
set -g history-limit 100000
set -g focus-events on
set -g set-clipboard on
set -g mouse off                      # "tmux set -g mouse on" if you prefer mouse scrolling
set -g base-index 0                  # scripts address the pane as claude:claude.0
set -g pane-base-index 0
set -g renumber-windows on
set -g status-interval 5
set -g status-left "[#S] "
set -g status-right " #H  %Y-%m-%d %H:%M "
